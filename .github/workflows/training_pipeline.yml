name: Training Pipeline - Daily Model Retraining

on:
  schedule:
    # Run every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  training-pipeline:
    name: Run Training Pipeline
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade hopsworks tenacity
      
      - name: Create .env file
        env:
          AQICN_API_KEY: ${{ secrets.AQICN_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
          CITY: ${{ secrets.CITY || 'karachi' }}
          CITY_LAT: ${{ secrets.CITY_LAT || '24.8607' }}
          CITY_LON: ${{ secrets.CITY_LON || '67.0011' }}
        run: |
          echo "AQICN_API_KEY=$AQICN_API_KEY" >> .env
          echo "HOPSWORKS_API_KEY=$HOPSWORKS_API_KEY" >> .env
          echo "HOPSWORKS_PROJECT_NAME=$HOPSWORKS_PROJECT_NAME" >> .env
          echo "CITY=$CITY" >> .env
          echo "CITY_LAT=$CITY_LAT" >> .env
          echo "CITY_LON=$CITY_LON" >> .env
      
      - name: Validate configuration
        run: python main.py --check-config
      
      - name: Run training pipeline
        run: python main.py --pipeline train
      
      - name: Upload trained models as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: models/
          retention-days: 30
      
      - name: Upload model comparison as artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-comparison
          path: models/model_comparison.csv
          retention-days: 30

      - name: Delete existing shap-latest release (if exists)
        run: |
          gh release delete shap-latest --yes || true
          git push origin :refs/tags/shap-latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-create shap-latest release with new CSV
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shap-latest
          name: "Latest SHAP Importance"
          body: "Auto-updated on every model training run"
          files: models/shap_importance.csv   # ← update this path
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

