name: Feature Pipeline - Hourly Data Collection

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  feature-pipeline:
    name: Run Feature Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade hopsworks tenacity

      - name: Create .env file
        env:
          AQICN_API_KEY: ${{ secrets.AQICN_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
          CITY: ${{ secrets.CITY || 'karachi' }}
          CITY_LAT: ${{ secrets.CITY_LAT || '24.8607' }}
          CITY_LON: ${{ secrets.CITY_LON || '67.0011' }}

        run: |
          echo "AQICN_API_KEY=$AQICN_API_KEY" >> .env
          echo "OPENWEATHER_API_KEY=$OPENWEATHER_API_KEY" >> .env
          echo "HOPSWORKS_API_KEY=$HOPSWORKS_API_KEY" >> .env
          echo "HOPSWORKS_PROJECT_NAME=$HOPSWORKS_PROJECT_NAME" >> .env
          echo "CITY=$CITY" >> .env
          echo "CITY_LAT=$CITY_LAT" >> .env
          echo "CITY_LON=$CITY_LON" >> .env

      - name: Fix DNS and debug connectivity
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf

          nslookup c.app.hopsworks.ai || true
          ping -c 2 c.app.hopsworks.ai || true

          python -c "import socket; print(socket.gethostbyname('c.app.hopsworks.ai'))"

      - name: Validate configuration
        run: python main.py --check-config

      - name: Run feature pipeline
        run: python main.py --pipeline feature

      - name: Upload features as artifact
        uses: actions/upload-artifact@v4
        with:
          name: features-csv
          path: data/features.csv
          retention-days: 7