name: Feature Pipeline - Hourly Data Collection

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  feature-pipeline:
    name: Run Feature Pipeline
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create .env file
        env:
          AQICN_API_KEY: ${{ secrets.AQICN_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          CITY: ${{ secrets.CITY || 'karachi' }}
          CITY_LAT: ${{ secrets.CITY_LAT || '24.8607' }}
          CITY_LON: ${{ secrets.CITY_LON || '67.0011' }}
        run: |
          echo "AQICN_API_KEY=$AQICN_API_KEY" >> .env
          echo "OPENWEATHER_API_KEY=$OPENWEATHER_API_KEY" >> .env
          echo "HOPSWORKS_API_KEY=$HOPSWORKS_API_KEY" >> .env
          echo "CITY=$CITY" >> .env
          echo "CITY_LAT=$CITY_LAT" >> .env
          echo "CITY_LON=$CITY_LON" >> .env
      
      - name: Add Hopsworks DNS to hosts
        run: |
          echo "54.220.231.18 c.app.hopsworks.ai" | sudo tee -a /etc/hosts

      - name: Validate configuration
        run: python main.py --check-config
      
      - name: Run feature pipeline
        run: python main.py --pipeline feature
      
      - name: Upload features as artifact
        uses: actions/upload-artifact@v4
        with:
          name: features-csv
          path: data/features.csv
          retention-days: 7
      
      - name: Commit and push features (optional)
        if: github.event_name == 'schedule'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/features.csv
          git diff --staged --quiet || git commit -m "Update features.csv [skip ci]"
          git push
